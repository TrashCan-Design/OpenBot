# One OpenBot tenant: the harness server plus Caddy for TLS + login.
#
# Caddy runs in the server's network namespace, so it reaches the server on
# 127.0.0.1 — the server never binds a public interface. Ports are therefore
# declared on the `openbot` service (the namespace owner).
#
#   cp .env.example .env   # set DOMAIN
#   docker compose pull openbot && docker compose up -d     # prebuilt image
#   docker compose up -d --build                            # or build from source
services:
  openbot: &openbot
    build:
      context: ..
      args:
        ENGINES: ${ENGINES:-}
    # prebuilt on every main push; `docker compose up --build` builds from source instead
    image: ${OPENBOT_IMAGE:-${OMB_IMAGE:-ghcr.io/trashcan-design/openbot:latest}}
    restart: unless-stopped
    # The bots' browsers (docs/browser-packaging.md, "Process hygiene"): an
    # init collects the browser processes whose parents exit, and Chrome
    # gets the shared memory OpenBot's desktop containers give it.
    init: true
    shm_size: 512m
    volumes:
      - data:/data
    ports:
      - "80:80"
      - "443:443"
    environment:
      OPENBOT_PORT: "8799"
      OPENBOT_WEBHOOK_PORT: "8800"
      # what the app prints as hook URLs — Caddy passes /hooks/* straight through
      OPENBOT_WEBHOOK_PUBLIC_URL: https://${DOMAIN}
      # pairing links for remote clients point here (docs/self-hosting.md)
      OPENBOT_PUBLIC_URL: https://${DOMAIN}
      # Who may sign in with an emailed code at /pair (docs/self-hosting.md,
      # "Sign in with your email"). Empty means pairing codes only.
      OPENBOT_SIGNIN_EMAILS: ${OPENBOT_SIGNIN_EMAILS:-${OMB_SIGNIN_EMAILS:-}}
      OPENBOT_SIGNIN_MEMBER_EMAILS: ${OPENBOT_SIGNIN_MEMBER_EMAILS:-${OMB_SIGNIN_MEMBER_EMAILS:-}}
      OMB_PORT: "8799"
      OMB_WEBHOOK_PORT: "8800"
      OMB_WEBHOOK_PUBLIC_URL: https://${DOMAIN}
      OMB_PUBLIC_URL: https://${DOMAIN}
      OMB_SIGNIN_EMAILS: ${OPENBOT_SIGNIN_EMAILS:-${OMB_SIGNIN_EMAILS:-}}
      OMB_SIGNIN_MEMBER_EMAILS: ${OPENBOT_SIGNIN_MEMBER_EMAILS:-${OMB_SIGNIN_MEMBER_EMAILS:-}}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8799/api/health | grep -qE 'openbot|openmausbot'"]
      interval: 30s
      timeout: 5s
      retries: 3

  omb:
    <<: *openbot
    init: true
    shm_size: 512m
    ports: []
    profiles: ["fallback"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    network_mode: "service:openbot"
    depends_on:
      openbot:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  data:
  caddy_data:
  caddy_config:
